name: Verify and deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Validate and package release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out the verified main revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm v11 is installed as a standalone binary. This avoids Corepack
      # signature/cache drift on hosted runners while honoring the pinned lock.
      - name: Install pinned pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.16.0
          install: false

      - name: Install browser acceptance dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Validate syntax, asset closure, and licenses
        run: npm run validate:release

      - name: Check graphics profiles and payload contracts
        run: npm run qa:graphics

      - name: Check gameplay mission and combat contracts
        run: npm run qa:gameplay

      - name: Check runtime acceptance contracts
        run: npm run qa:runtime

      - name: Run Chromium mission acceptance
        # Five cold-cache scenarios include a full graphics-setting persistence
        # pass. AUTO deliberately samples gameplay even on a software/mobile-
        # like renderer, so preserve its conservative completion window while a
        # hard cap still protects the release lane from a browser/server deadlock.
        timeout-minutes: 40
        run: npm run qa:browser

      - name: Preserve browser evidence on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Package the tested repository revision
        env:
          RELEASE_VERSION: main-${{ github.sha }}
        run: npm run package:release

      - name: Test release ZIP integrity
        run: unzip -t .release/artifacts/*.zip

      - name: Verify Pages package and release ZIP
        run: npm run verify:release

      - name: Publish the verified replacement ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.sha }}
          RELEASE_TITLE: "SPECTER: Blacksite build ${{ github.sha }}"
          RELEASE_ARCHIVE: .release/artifacts/specter-blacksite-main-${{ github.sha }}.zip
          RELEASE_NOTES: .release/artifacts/specter-blacksite-main-${{ github.sha }}-release-notes.md
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ARCHIVE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES" --latest --repo "$GITHUB_REPOSITORY"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .release/pages

  deploy:
    name: Deploy verified Pages build
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
